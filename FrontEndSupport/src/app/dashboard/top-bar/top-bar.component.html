<header class="relative z-10 h-20 bg-gray-900 border-b border-gray-800 text-white flex items-center px-4">
  <div class="relative z-10 mx-auto flex h-full w-full flex-col justify-center">
    <div class="relative flex w-full items-center justify-between">
      
      <!-- Section Gauche : Toggle Sidebar + Logo Hexabyte + Texte descriptif -->
      <div class="flex items-center gap-4">
        
        <!-- 1. Bouton Toggle Sidebar -->
        <button
          type="button"
          aria-label="Toggle sidebar"
          class="p-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 transition focus:outline-none cursor-pointer"
          (click)="openSidebar()"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <!-- 2. Logo Hexabyte sans bordure (lien vers home) -->
        <a href="home" routerLink="/home" class="flex items-center focus:outline-none p-0 m-0">
          <img 
            src="/assets/images/logo-hexabyte.png" 
            alt="Hexabyte Logo" 
            class="h-16 w-auto max-w-[120px] object-contain shadow-none bg-transparent"
          />
        </a>

        <!-- 3. Texte ajouté après l'image -->
        <span class="font-bold text-sm md:text-base tracking-wide text-blue-400 hidden sm:inline pl-4">
          Hexabyte Reclaim Site
        </span>

      </div>

      <!-- Section Droite : Accueil, Bouton Salon & Petit Logo -->
      <div class="relative flex items-center gap-3">
        
        <!-- Bouton Accueil (Home) -->
        <a 
          routerLink="admin/home" 
          class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white transition cursor-pointer text-sm font-medium shadow-md"
          title="Accueil"
        >
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span class="hidden md:inline">Accueil</span>
        </a>

        <!-- Bouton "Join a salon" / "Rejoindre un salon" -->
        <a 
          routerLink="admin/area"
          class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white transition cursor-pointer text-sm font-medium shadow-md"
          title="Rejoindre un salon"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1 1 0 01-1-1v-1m3-4h.01M12 12h.01M15 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span class="hidden md:inline">Rejoindre un salon</span>
        </a>

        <!-- Petit bouton logo secondaire -->
        <button 
          class="p-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 border border-gray-700 transition flex items-center justify-center cursor-pointer shadow-sm"
          title="Hexabyte Profile"
        >
          <img 
            src="/assets/images/logo-hexabyte.png" 
            alt="Mini Logo" 
            class="w-7 h-7 object-contain rounded-full"
          />
        </button>

      </div>

    </div>
  </div>
</header>
