Application · PROPERTIES
# ---------- Application ----------
spring.application.name=hexaclientspace
server.port=8080
 
# ---------- Base de donnees MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/hexabyte_espace_client?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Tunis
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# ---------- JPA / Hibernate ----------
# update en developpement ; passer a "validate" + Flyway/Liquibase ensuite.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
 
# ---------- JWT ----------
# Cle de 256 bits encodee en Base64. A REMPLACER et a sortir du code source
# (variable d'environnement) avant toute mise en ligne.
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS0zMi1ieXRlLWRlbW8ta2V5ISEh}
# 1 heure
app.jwt.expiration-ms=3600000



spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.config.import=optional:file:.env[.properties]


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- Divers ----------
spring.jackson.serialization.write-dates-as-timestamps=false
 
spring.ai.openai.chat.options.max-tokens=500
spring.ai.openai.chat.options.temperature=0.3

logging.level.org.springframework.security=DEBUG